name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployed Vercel URL, for example https://mpsc-pulse.vercel.app
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate deployed app URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Provide app_url when starting this workflow."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets

      - name: Create Capacitor configuration
        shell: bash
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>MPSC Pulse</title></head><body></body></html>' > www/index.html
          npx cap init "MPSC Pulse" "in.mpscpulse.app" --web-dir www
          rm -f capacitor.config.ts
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('capacitor.config.json', JSON.stringify({appId:'in.mpscpulse.app',appName:'MPSC Pulse',webDir:'www',server:{url:process.env.APP_URL,cleartext:false}}, null, 2) + '\\n')"

      - name: Add Android platform
        run: npx cap add android

      - name: Add native Razorpay Android bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/in/mpscpulse/app
          cp android-template/RazorpayNativePlugin.java android/app/src/main/java/in/mpscpulse/app/RazorpayNativePlugin.java
          cat > android/app/src/main/java/in/mpscpulse/app/MainActivity.java <<'EOF'
          package in.mpscpulse.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RazorpayNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "com.razorpay:checkout:1.6.41"' android/app/build.gradle

      - name: Generate Android branding
        shell: bash
        run: |
          mkdir -p resources
          cp public/mpsc-pulse-logo.png.jpeg resources/icon.png
          cp public/mpsc-pulse-logo.png.jpeg resources/splash.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#eaf0f7" \
            --splashBackgroundColor "#eaf0f7"

      - name: Align Kotlin dependencies
        shell: bash
        run: |
          cat >> android/build.gradle <<'EOF'

          // Capacitor plugins may request legacy split Kotlin stdlib artifacts.
          subprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            configurations.configureEach {
              resolutionStrategy.eachDependency { dependency ->
                if (dependency.requested.group == 'org.jetbrains.kotlin') {
                  dependency.useVersion '1.8.22'
                }
              }
            }
          }
          EOF

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpsc-pulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error