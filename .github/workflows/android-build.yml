name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployed Vercel URL, for example https://mpsc-pulse.vercel.app
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
        # No `cache: gradle` here: setup-java's cache key is computed by
        # hashing gradle-wrapper.properties/*.gradle* files, but this
        # workflow generates the entire android/ project later via
        # `npx cap add android` — nothing Gradle-related exists in the
        # checkout yet at this point, so the cache step has nothing to hash
        # and fails outright ("No file ... matched").

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate deployed app URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Provide app_url when starting this workflow."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Install Capacitor
        # @capacitor/core and @capacitor/browser are real dependencies in
        # package.json (used at runtime by the web bundle to detect the
        # native shell and open external URLs via the in-app Browser), so
        # `npm ci` above already installed them. Only the build-only tooling
        # needs installing here.
        run: npm install --no-save -D @capacitor/cli @capacitor/android @capacitor/assets

      - name: Create Capacitor configuration
        shell: bash
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>MPSC Pulse</title></head><body></body></html>' > www/index.html
          npx cap init "MPSC Pulse" "in.mpscpulse.app" --web-dir www
          rm -f capacitor.config.ts
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('capacitor.config.json', JSON.stringify({appId:'in.mpscpulse.app',appName:'MPSC Pulse',webDir:'www',server:{url:process.env.APP_URL,cleartext:false}}, null, 2) + '\\n')"

      - name: Add Android platform
        run: npx cap add android

      - name: Add native Razorpay Android bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/in/mpscpulse/app
          cp android-template/RazorpayNativePlugin.java android/app/src/main/java/in/mpscpulse/app/RazorpayNativePlugin.java
          cat > android/app/src/main/java/in/mpscpulse/app/MainActivity.java <<'EOF'
          package in.mpscpulse.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.razorpay.PaymentData;
          import com.razorpay.PaymentResultWithDataListener;

          public class MainActivity extends BridgeActivity implements PaymentResultWithDataListener {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RazorpayNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onPaymentSuccess(String paymentId, PaymentData paymentData) {
                  RazorpayNativePlugin plugin = RazorpayNativePlugin.getInstance();
                  if (plugin != null) {
                      plugin.handlePaymentSuccess(paymentId, paymentData);
                  }
              }

              @Override
              public void onPaymentError(int code, String description, PaymentData paymentData) {
                  RazorpayNativePlugin plugin = RazorpayNativePlugin.getInstance();
                  if (plugin != null) {
                      plugin.handlePaymentError(code, description, paymentData);
                  }
              }
          }
          EOF
          sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "com.razorpay:checkout:1.6.41"' android/app/build.gradle

      - name: Generate Android branding
        shell: bash
        run: |
          mkdir -p resources
          cp public/mpsclogo.jpeg resources/icon.png
          cp public/mpsclogo.jpeg resources/splash.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#eaf0f7" \
            --splashBackgroundColor "#eaf0f7"

      - name: Align Kotlin dependencies
        shell: bash
        run: |
          cat >> android/build.gradle <<'EOF'

          // Capacitor plugins may request legacy split Kotlin stdlib artifacts.
          subprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            configurations.configureEach {
              resolutionStrategy.eachDependency { dependency ->
                if (dependency.requested.group == 'org.jetbrains.kotlin') {
                  dependency.useVersion '1.8.22'
                }
              }
            }
          }
          EOF

      - name: Pin androidx.browser to the project's compileSdk
        # @capacitor/browser's Android module defaults to androidx.browser
        # 1.9.0, whose AAR metadata requires consumers to compile against
        # SDK 36 and AGP 8.9.1+ — newer than what this template's compileSdk
        # (see android/variables.gradle) and AGP classpath (android/build.gradle)
        # currently provide. androidx.browser 1.9.0 didn't add anything this
        # app's use of Browser.open() needs, so pin back to 1.8.0 (only needs
        # compileSdk 34+, per its AAR metadata) via Capacitor's own
        # variables.gradle override point rather than bumping the whole
        # Android toolchain.
        shell: bash
        run: sed -i "/^ext[[:space:]]*{/a\\    androidxBrowserVersion = '1.8.0'" android/variables.gradle

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Gradle network resilience
        # Maven Central rate-limits shared GitHub Actions runner IPs (HTTP 429)
        # fairly often once a build's dependency graph fans out this wide
        # (AGP 8.7.2 alone pulls ~50 transitive artifacts). None of that is
        # something our build.gradle controls, so make Gradle itself retry
        # a throttled resolution instead of failing the build on the first
        # 429 it sees.
        shell: bash
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.internal.repository.max.retries=10
          org.gradle.internal.repository.initial.backoff=1000
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          GRADLE_RESILIENCE_ARGS="-Dorg.gradle.internal.repository.max.retries=10 -Dorg.gradle.internal.repository.initial.backoff=1000"
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon $GRADLE_RESILIENCE_ARGS; then
              exit 0
            fi
            echo "Gradle build failed (attempt $attempt/3) — likely a transient Maven Central rate limit. Retrying..."
            sleep $((attempt * 45))
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpsc-pulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error