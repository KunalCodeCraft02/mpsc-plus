name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployed Vercel URL, for example https://mpsc-pulse.vercel.app
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate deployed app URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Provide app_url when starting this workflow."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor configuration
        shell: bash
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>MPSC Pulse</title></head><body></body></html>' > www/index.html
          npx cap init "MPSC Pulse" "in.mpscpulse.app" --web-dir www
          rm -f capacitor.config.ts
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('capacitor.config.json', JSON.stringify({appId:'in.mpscpulse.app',appName:'MPSC Pulse',webDir:'www',server:{url:process.env.APP_URL,cleartext:false}}, null, 2) + '\\n')"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpsc-pulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error